name: update-deadlines
on:
  schedule:
    - cron: "0 */12 * * *"   # every 12h (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-deadlines
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate merged .ics
        run: python merge_deadlines.py   # exits non-zero on upstream outage -> job fails, old .ics kept
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-deadlines.ics
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update deadlines $(date -u +%FT%TZ)"
            git push
          fi
